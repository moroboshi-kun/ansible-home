---
- name: Install dependencies
  apt:
    name:
      - gnupg
      - software-properties-common
    state: present
    update_cache: yes

- name: Add HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/vagrant.asc
    mode: '0644'

- name: Add HashiCorp repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/vagrant.asc] {{ hashicorp_repo_url }} {{ ansible_distribution_release }} main"
    state: present
    update_cache: yes

- name: Install Terraform
  apt:
    name: terraform # comment out and and uncomment line below for specific version
    # name: "terraform={{ terraform_version }}" uncomment for specific version
    state: present

- name: Verify Terraform installation
  command: terraform --version
  register: terraform_version_output

- name: Display installed Terraform version
  debug:
    msg: "Terraform installed successfully: {{ terraform_version_output.stdout }}"

